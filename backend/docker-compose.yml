services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speechpartner-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Automatic HTTPS / SSL Reverse Proxy via Caddy
  # Run standard backend:       docker compose up -d
  # Run with automatic SSL:     docker compose --profile ssl up -d
  caddy:
    image: caddy:2-alpine
    container_name: speechpartner-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - ssl

volumes:
  caddy_data:
  caddy_config:
